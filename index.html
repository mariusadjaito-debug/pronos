<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronos du jour</title>
<style>
:root{--bg:#f2f4ec;--card:#fff;--ink:#14231c;--mute:#5d6b63;--line:#d9dfd2;--home:#1f6b4a;--draw:#b9c2b2;--away:#c4572f;--gold:#c58a0c;--warn:#fff3d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a14;--card:#16261d;--ink:#eaf0e6;--mute:#9bab9f;--line:#2a3d32;--home:#4cc08a;--draw:#51635a;--away:#e8825a;--gold:#e8b94a;--warn:#33290f}}
:root[data-theme="dark"]{--bg:#0e1a14;--card:#16261d;--ink:#eaf0e6;--mute:#9bab9f;--line:#2a3d32;--home:#4cc08a;--draw:#51635a;--away:#e8825a;--gold:#e8b94a;--warn:#33290f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:4px 0 12px;letter-spacing:-.01em}
.warn{background:var(--warn);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--home);border-color:var(--home);color:#fff}
.chips button:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem}
.teams{font-size:1.1rem;font-weight:700;margin:6px 0 10px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.bar i{display:block;height:100%}
.pct{display:flex;justify-content:space-between;font-size:.85rem;margin-top:6px;color:var(--mute)}
.pct b{color:var(--ink)}
.pick{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);gap:8px}
.pick strong{font-size:.95rem}
.conf{font-size:.85rem;white-space:nowrap}
.conf::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.extra{display:flex;gap:14px;margin-top:8px;font-size:.85rem;color:var(--mute);flex-wrap:wrap}
.extra b{color:var(--ink)}
.go{width:100%;margin-top:12px;border:0;border-radius:10px;background:var(--home);color:#fff;font:inherit;font-weight:600;padding:12px;cursor:pointer}
.go:disabled{opacity:.7}
.go:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ana{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.ana .st{color:var(--mute);font-size:.88rem;margin-bottom:4px}
.row{display:grid;grid-template-columns:1.2fr .55fr .55fr 1.7fr;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.row:last-child{border-bottom:0}
.row.h{color:var(--mute);font-size:.78rem}
.row .n{font-weight:600}
.row .p b{display:block}
.row .p span{color:var(--mute);font-size:.78rem}
footer{color:var(--mute);font-size:.8rem;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Pronos du jour</h1>
<div class="warn" id="upd">Chargement des pronostics…</div>
<div class="chips" id="chips" role="group" aria-label="Filtrer par championnat"></div>
<div id="list"></div>
<footer>Probabilités calculées avec un modèle de Poisson à partir des buts attendus de chaque équipe. Ce sont des estimations, sans garantie de gain.</footer>
</main>
<script>
let M=[];
const T=d=>new Date(d).toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const EV=[['s','Tirs',24.5],['c','Tirs cadrés',8.5],['f','Fautes',24.5],['k','Cartons jaunes',4.5],['o','Hors-jeu',3.5]];
const fact=n=>n<2?1:n*fact(n-1);
const pois=(k,l)=>Math.exp(-l)*Math.pow(l,k)/fact(k);
function calc(x,y){let h=0,d=0,a=0,o=0,b=0;
for(let i=0;i<=8;i++)for(let j=0;j<=8;j++){const p=pois(i,x)*pois(j,y);
if(i>j)h+=p;else if(i===j)d+=p;else a+=p;if(i+j>2)o+=p;if(i>0&&j>0)b+=p}
const s=h+d+a;return{h:h/s,d:d/s,a:a/s,o:o/s,b:b/s}}
const P=v=>Math.round(v*100)+'\u00a0%';
let cur='Tous';
function card(m){
const r=calc(m.x,m.y);const top=Math.max(r.h,r.d,r.a);
const pick=top===r.h?'Victoire '+m.h:top===r.a?'Victoire '+m.a:'Match nul';
const lvl=top>=.55?['Élevée','var(--home)']:top>=.45?['Moyenne','var(--gold)']:['Faible','var(--away)'];
return `<article class="card" tabindex="0">
<div class="top"><span>${m.l}</span><span>${T(m.d)}</span></div>
<div class="teams">${m.h} – ${m.a}</div>
<div class="bar" role="img" aria-label="Probabilités : ${m.h} ${P(r.h)}, nul ${P(r.d)}, ${m.a} ${P(r.a)}">
<i style="width:${r.h*100}%;background:var(--home)"></i><i style="width:${r.d*100}%;background:var(--draw)"></i><i style="width:${r.a*100}%;background:var(--away)"></i></div>
<div class="pct"><span>Domicile <b>${P(r.h)}</b></span><span>Nul <b>${P(r.d)}</b></span><span>Extérieur <b>${P(r.a)}</b></span></div>
<div class="extra"><span>Plus de 2,5 buts <b>${P(r.o)}</b></span><span>Les deux marquent <b>${P(r.b)}</b></span></div>
<div class="pick"><strong>${pick}</strong><span class="conf" style="--c:${lvl[1]}">Confiance ${lvl[0].toLowerCase()}</span></div>
<button class="go" onclick="analyse(${M.indexOf(m)},this)">Lancer l'analyse détaillée</button><div class="ana" hidden></div>
</article>`}
const over=(t,line)=>{let c=0;for(let k=0;k<=Math.floor(line);k++)c+=pois(k,t);return 1-c};
const F=v=>v.toFixed(1).replace('.',',');
function analyse(i,btn){
const m=M[i],box=btn.nextElementSibling;
btn.disabled=true;btn.textContent='Analyse en cours…';
setTimeout(()=>{
const rows=EV.filter(([k])=>m.e[k]).map(([k,n,line])=>{const [a,b]=m.e[k],t=a+b,p=over(t,line),pl=p>=.5;
return `<div class="row"><span class="n">${n}</span><span>${F(a)}</span><span>${F(b)}</span><span class="p"><b>${pl?'Plus':'Moins'} de ${String(line).replace('.',',')}</b><span>${P(pl?p:1-p)} · total ${F(t)}</span></span></div>`}).join('');
box.innerHTML=`<div class="st">Valeurs attendues pour ${m.h} – ${m.a}</div><div class="row h"><span>Événement</span><span>Dom.</span><span>Ext.</span><span>Pronostic</span></div>${rows}`;
box.hidden=false;btn.disabled=false;btn.textContent="Relancer l'analyse"},700)}
function render(){
document.getElementById('list').innerHTML=M.filter(m=>cur==='Tous'||m.l===cur).map(card).join('');
const ls=['Tous',...new Set(M.map(m=>m.l))];
const c=document.getElementById('chips');c.innerHTML='';
ls.forEach(l=>{const b=document.createElement('button');b.textContent=l;b.setAttribute('aria-pressed',l===cur);b.onclick=()=>{cur=l;render()};c.appendChild(b)})}
fetch('predictions.json?'+Date.now()).then(r=>r.json()).then(d=>{M=d.matches;
document.getElementById('upd').textContent=M.length?'Mis à jour le '+d.updated+' · '+M.length+' matchs dans les 7 prochains jours':'Aucun match trouvé pour les 7 prochains jours.';
render()}).catch(()=>{document.getElementById('upd').textContent="Pas encore de données : lancez la mise à jour dans l'onglet Actions."});
</script>
</body>
</html>
