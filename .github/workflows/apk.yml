name: Construire l'application Android (APK)
on:
  workflow_dispatch:
    inputs:
      nom:
        description: "Nom de l'application sous l'icône"
        default: "NIPER PRO"
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Clé de signature stable
        run: |
          mkdir -p "$HOME/.android"
          if [ -f apk-key/debug.keystore ]; then
            cp apk-key/debug.keystore "$HOME/.android/debug.keystore"
          else
            mkdir -p apk-key
            keytool -genkeypair -keystore apk-key/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=M.Adj.Pro,O=M.Adj.Pro,C=FR"
            cp apk-key/debug.keystore "$HOME/.android/debug.keystore"
            git config user.name "pronos-bot"
            git config user.email "pronos-bot@users.noreply.github.com"
            git add apk-key/debug.keystore
            git commit -m "Clé de signature de l'application Android"
            git pull --rebase origin main
            git push
          fi
      - name: Préparer Android
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sL -o /tmp/cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmd.zip -d /tmp/cmd
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -r /tmp/cmd/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager : $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - name: Préparer le projet
        env:
          NOM: ${{ github.event.inputs.nom }}
        run: |
          mkdir -p apk/www
          cd apk
          cat > package.json <<'EOF'
          {
            "name": "madj-pro",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "@capacitor/android": "^6.2.0", "@capacitor/core": "^6.2.0" },
            "devDependencies": { "@capacitor/assets": "^3.0.5", "@capacitor/cli": "^6.2.0" }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.madjpro.app",
            "appName": "M.Adj.Pro",
            "webDir": "www",
            "backgroundColor": "#07101f",
            "server": {
              "url": "https://mariusadjaito-debug.github.io/pronos/",
              "errorPath": "offline.html",
              "androidScheme": "https",
              "allowNavigation": ["mariusadjaito-debug.github.io"]
            },
            "android": { "backgroundColor": "#07101f" }
          }
          EOF
          python3 -c "import json,os;p='capacitor.config.json';c=json.load(open(p,encoding='utf-8'));c['appName']=os.environ.get('NOM') or 'NIPER PRO';json.dump(c,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          cat > www/index.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=https://mariusadjaito-debug.github.io/pronos/"><title>M.Adj.Pro</title></head><body style="background:#07101f"></body></html>
          EOF
          cat > www/offline.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.Adj.Pro</title>
          <style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 80% at 50% 20%,#1b4fb8,#07101f 70%);color:#fff;font:18px system-ui,sans-serif;text-align:center;padding:24px}h1{margin:0;font-size:2rem;letter-spacing:.05em}a{padding:14px 28px;border-radius:14px;background:#16a34a;color:#fff;text-decoration:none;font-weight:700}</style></head>
          <body><h1>M.Adj.Pro</h1><p>Pas de connexion internet.<br>Vérifie ton réseau puis réessaie.</p><a href="https://mariusadjaito-debug.github.io/pronos/">Réessayer</a></body></html>
          EOF
          cat > make_icon.py <<'PYEOF'
          """Logo de l'application : utilise l'image du dossier logo/ (ballon d'or), la centre sur fond noir et fabrique toutes les tailles."""
          import glob
          import os
          from PIL import Image, ImageDraw, ImageFilter

          noir = (0, 0, 0)
          fichiers = [f for f in sorted(glob.glob("../logo/*")) if f.lower().endswith((".png", ".jpg", ".jpeg", ".webp"))]
          if fichiers:
              src = Image.open(fichiers[0]).convert("RGBA")
              print("logo utilisé :", fichiers[0], src.size)
              c = min(src.size)
              src = src.crop(((src.width - c) // 2, (src.height - c) // 2, (src.width + c) // 2, (src.height + c) // 2))
          else:
              print("aucune image dans logo/ : ballon doré simple")
              src = Image.new("RGBA", (1024, 1024), noir + (255,))
              d = ImageDraw.Draw(src)
              for i in range(400, 0, -4):
                  k = i / 400
                  d.ellipse([512 - i, 512 - i, 512 + i, 512 + i], fill=(int(255 - 60 * k), int(215 - 90 * k), int(70 - 60 * k), 255))


          def badge(taille):
              """L'image en rond, bords lisses."""
              big = src.resize((taille * 3, taille * 3), Image.LANCZOS)
              mask = Image.new("L", (taille * 3, taille * 3), 0)
              ImageDraw.Draw(mask).ellipse([0, 0, taille * 3 - 1, taille * 3 - 1], fill=255)
              big.putalpha(mask)
              return big.resize((taille, taille), Image.LANCZOS)


          def sur_fond(taille_canevas, taille_badge, fond):
              img = Image.new("RGBA", (taille_canevas, taille_canevas), fond)
              b = badge(taille_badge)
              p = (taille_canevas - taille_badge) // 2
              img.alpha_composite(b, (p, p))
              return img


          os.makedirs("assets", exist_ok=True)
          sur_fond(1024, 940, noir + (255,)).convert("RGB").save("assets/icon-only.png")
          sur_fond(1024, 700, (0, 0, 0, 0)).save("assets/icon-foreground.png")
          Image.new("RGB", (1024, 1024), noir).save("assets/icon-background.png")
          for nom in ("splash.png", "splash-dark.png"):
              sur_fond(2732, 1000, noir + (255,)).convert("RGB").save("assets/" + nom)
          print("logo créé")
          PYEOF
      - name: Dessiner le logo
        run: |
          cd apk
          pip install pillow
          python3 make_icon.py
      - name: Créer le projet Android
        run: |
          cd apk
          npm install
          npx cap add android
          npx @capacitor/assets generate --android
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
          F="$(find android/app/src/main/java -name MainActivity.java | head -1)"
          echo "MainActivity : $F"
          cat > "$F" <<'EOF'
          package com.madjpro.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().getSettings().setTextZoom(100);
              }
          }
          EOF
      - name: Construire l'APK
        run: |
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publier le fichier APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/android/app/build/outputs/apk/debug/app-debug.apk M-Adj-Pro.apk
          gh release create "apk-${{ github.run_number }}" M-Adj-Pro.apk --title "M.Adj.Pro - APK n°${{ github.run_number }}" --notes "Application Android M.Adj.Pro. Ouvre ce fichier sur ton téléphone pour l'installer."
