name: Test n°2 - modèle complet ou modèle de base
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comparer les modèles
        run: python backtest2.py
      - name: Enregistrer le rapport
        run: |
          git config user.name "pronos-bot"
          git config user.email "pronos-bot@users.noreply.github.com"
          git add rapport2.txt
          git diff --staged --quiet || (git commit -m "Rapport n°2" && git pull --rebase origin main && git push)
