name: Test n°8 - cotes 1,4 à 2,0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mesurer les cotes 1,4 à 2,0
        run: python backtest8.py
      - name: Enregistrer le rapport
        run: |
          git config user.name "pronos-bot"
          git config user.email "pronos-bot@users.noreply.github.com"
          git add rapport8.txt
          git diff --staged --quiet || (git commit -m "Rapport n°8" && git pull --rebase origin main && git push)
